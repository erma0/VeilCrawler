<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebView2 Scraper Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0d1117',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Ensure the simulated site looks distinct */
      .simulated-site {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Custom Minimalist Scrollbar */
      ::-webkit-scrollbar {
        width: 3px;
        height: 3px;
      }

      ::-webkit-scrollbar-track {
        background: transparent; 
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(100, 116, 139, 0.3); /* Transparent Slate */
        border-radius: 20px;
        transition: background 0.3s;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.8); /* Darker on hover */
      }
      
      /* Make resizing handles and other scroll areas obey this */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(100, 116, 139, 0.3) transparent;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body class="bg-transparent overflow-hidden">
    <div id="root"></div>
  </body>
</html>
